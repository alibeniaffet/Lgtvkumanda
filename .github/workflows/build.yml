name: Build LG 42LA640S Remote APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="LG_42LA640S_Kumanda_Project.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: $ZIP_FILE not found in repository root."; exit 1; }
          echo "Using: $ZIP_FILE"

      - name: Unzip Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-project
          mkdir -p android-project
          unzip -q "LG_42LA640S_Kumanda_Project.zip" -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
          echo "Android project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already contain Android SDK tools.
      # Do not use android-actions/setup-android here: its v3 action can
      # attempt to install the obsolete 'tools' package and fail.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf "$RUNNER_TEMP/gradle-8.9"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LG-42LA640S-Kumanda-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
