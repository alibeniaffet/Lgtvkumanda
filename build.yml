name: Build LG 42LA640S Remote APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="LG_42LA640S_Kumanda_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Upload the project ZIP to the root of the GitHub repository."
            exit 1
          fi
          echo "Using $ZIP_FILE"

      - name: Unzip Android project
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          unzip -q LG_42LA640S_Kumanda_Project.zip -d android-project
          echo "Project files:"
          find android-project -maxdepth 3 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Build debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-42LA640S-Kumanda-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
